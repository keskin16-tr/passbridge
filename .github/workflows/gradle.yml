name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Proje kodunu GitHub'dan çeker
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. JDK (Java Development Kit) kurulumu yapar
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Gradle ortamını kurar ve önbellekleme (caching) yönetir
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Gradle Wrapper'a çalıştırma izni ver (Linux/macOS için önemlidir)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Gradle Wrapper ile projeyi derle ve testleri çalıştır
    - name: Build with Gradle Wrapper
      run: ./gradlew build
