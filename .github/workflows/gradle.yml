name: Android CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje kodunu çeker
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Android ve Gradle ile tam uyumlu JDK 17 kurulumu
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle ortamını ve önbelleği (cache) hazırlar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Linux ortamı için gradlew çalıştırma izni verir
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Projeyi derler (Eğer sadece APK üretmek isterseniz './gradlew assembleDebug' yazabilirsiniz)
      - name: Build with Gradle Wrapper
        run: ./gradlew build
