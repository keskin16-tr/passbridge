name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -Pkotlin.compiler.options.freeCompilerArgs="-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PassBridgeStudioPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
